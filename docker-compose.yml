version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: climate_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: climate_hazard

  redis:
    image: redis:7-alpine
    container_name: climate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  mongo_data:
